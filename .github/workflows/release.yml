name: Release

# Manual release: verifies the build, bumps the version, tags the commit,
# builds the .vsix, publishes it to the Visual Studio Marketplace (when
# VSCE_PAT is set) and attaches it to a GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm run check:registry
          npm test

      - name: Bump version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i -E "s#badge/version-[0-9]+\.[0-9]+\.[0-9]+-#badge/version-$VERSION-#" README.md

      - name: Commit and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "v$VERSION"

      - name: Package extension
        run: npx @vscode/vsce package --out "vscode-agent-context-$VERSION.vsix"

      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --packagePath "vscode-agent-context-$VERSION.vsix"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Agent Context v${{ env.VERSION }}
          generate_release_notes: true
          files: vscode-agent-context-${{ env.VERSION }}.vsix
